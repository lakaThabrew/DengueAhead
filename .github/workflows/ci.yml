name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Node.js: lint · typecheck · unit · integration · build ──────────────────
  node:
    name: Node.js — lint, typecheck, test, build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint + Prettier)
        run: npm run lint

      - name: Typecheck (build contracts first, then check all)
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration
        env:
          MONGODB_URI: mongodb://localhost:27017/dengueahead
          MONGODB_TEST_URI: mongodb://localhost:27017/dengueahead_test

      - name: Build
        run: npm run build

      - name: Dependency audit (informational)
        run: npm audit --omit=dev
        continue-on-error: true

  # ── Python: ruff · pytest ────────────────────────────────────────────────────
  python:
    name: Python — ruff, pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/ml/pyproject.toml

      - name: Install ML package with dev dependencies
        run: |
          pip install --upgrade pip
          pip install -e 'services/ml[dev]'

      - name: Ruff lint
        run: ruff check services/ml/src services/ml/tests

      - name: Ruff format check
        run: ruff format --check services/ml/src services/ml/tests

      - name: Pytest unit + contract parity tests
        run: python -m pytest services/ml/tests -v

  # ── E2E: Playwright ──────────────────────────────────────────────────────────
  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    needs: [node, python]

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build contracts (required before serving)
        run: npm run build:contracts

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          MONGODB_URI: mongodb://localhost:27017/dengueahead

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
