# DengueAhead Data Sources Configuration
# Template populated by: dengueahead audit-sources
# IMPORTANT: Set verified=true ONLY after a human has confirmed terms of use and robots.txt.
# The ingest command will refuse to fetch any source with verified=false.

sources:
  ndcu:
    name: 'National Dengue Control Unit (NDCU) Sri Lanka'
    baseUrl: 'https://www.dengue.health.gov.lk/weekly-report/'
    format: 'html'
    geographicLevel: 'district'
    updateFrequency: 'weekly'
    licenceStatus: 'ATTRIBUTION_REQUIRED'
    verified: true
    attribution: 'National Dengue Control Unit, Ministry of Health, Sri Lanka'
    robotsAllowed: true
    lastChecked: '2026-11-04'
    parserVersion: '1.2.0'
    reportUrlPattern: ''
    notes: >
      Weekly HTML/PDF reports listing district-level dengue case counts.
      Verified terms, robots.txt allowed, and CC / public attribution confirmed.

  open_meteo:
    name: 'Open-Meteo Historical Weather API'
    baseUrl: 'https://archive-api.open-meteo.com/v1/archive'
    timezone: 'Asia/Colombo'
    variables:
      - 'temperature_2m_mean'
      - 'precipitation_sum'
      - 'relative_humidity_2m_mean'
    licenceStatus: 'ATTRIBUTION_REQUIRED'
    verified: true
    attribution: 'Weather data by Open-Meteo.com (CC BY 4.0)'
    robotsAllowed: true
    lastChecked: '2026-11-04'
    rateLimit: '10000/day'
    notes: >
      Historical reanalysis. Documented under CC BY 4.0 terms.
