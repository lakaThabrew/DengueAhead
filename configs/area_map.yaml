# DengueAhead Area Name Mapping
# Maps NDCU report name variants → canonical areaId (LK-{district-code})
# District codes follow ISO 3166-2:LK and Sri Lanka DCS district numbering.
#
# unmatched_policy options:
#   quarantine  — store observation with areaId="QUARANTINE" + UNMATCHED_AREA flag (default)
#   warn        — log warning and skip the observation
#   reject      — raise ParseError (stops ingestion)

unmatched_policy: 'quarantine'

mappings:
