# DengueAhead ML Model Configuration
model:
  name: "dengueahead-baseline-lightgbm"
  version: "v0.1.0"
  target: "emerging_hotspot"
  forecastHorizonWeeks: 1
  geographicLevel: "district"

features:
  caseLags: [1, 2, 3, 4]
  weatherLags: [1, 2, 3]
  rollingWindows: [2, 4, 8]
  includeSeasonality: true

training:
  minHistoricalWeeks: 52
  splitStrategy: "temporal_rolling"
  randomSeed: 42

